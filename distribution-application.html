<style>
/* 胶囊开关：固定文字区与滑块区，避免两者重叠 */
.permission-switch{width:64px!important;height:22px!important;padding:0!important;border-radius:999px;background:#c9cdd4;position:relative;overflow:hidden;color:transparent;font-size:0}
.permission-switch::before{content:"禁用";position:absolute;right:8px;top:0;width:24px;height:22px;line-height:22px;color:#fff;font-size:10px;text-align:right;white-space:nowrap;z-index:1}

.permission-switch:not(.on)::after{left:2px}
.permission-switch.on{background:#2f73e6}
.permission-switch.on::before{content:"启用";left:8px;right:auto;width:24px;text-align:left}
.permission-switch.on::after{left:44px;transform:none}

    &lt;main class=&quot;content&quot;&gt;
      &lt;div class=&quot;config-page-wrap&quot; id=&quot;taxConfigWrap&quot;&gt;&lt;section class=&quot;admin-config-page&quot; id=&quot;taxConfigPage&quot; aria-label=&quot;税率配置&quot;&gt;
        &lt;div class=&quot;config-head&quot;&gt;&lt;h2&gt;税率配置&lt;/h2&gt;&lt;/div&gt;
        &lt;div class=&quot;config-body&quot;&gt;&lt;div class=&quot;config-section&quot;&gt;&lt;div class=&quot;config-section-title&quot;&gt;&lt;h3&gt;税费阶梯&lt;/h3&gt;&lt;label class=&quot;config-switch&quot;&gt;&lt;input id=&quot;taxEnabled&quot; type=&quot;checkbox&quot; checked&gt;&lt;span&gt;启用&lt;/span&gt;&lt;/label&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;addTaxTier&quot; disabled hidden&gt;增加阶梯&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tax-tier-table-wrap&quot;&gt;&lt;table class=&quot;tax-tier-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;金额下限（元）&lt;/th&gt;&lt;th&gt;金额上限（元）&lt;/th&gt;&lt;th&gt;应纳税额&lt;/th&gt;&lt;th&gt;税率（%）&lt;/th&gt;&lt;th&gt;计算公式&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;taxTierBody&quot;&gt;&lt;tr&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;0&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;800&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;0&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.01&quot; value=&quot;20&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;0&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;btn text tax-remove&quot; type=&quot;button&quot; disabled hidden&gt;删除&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;800&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;4000&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;A-800&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.01&quot; value=&quot;20&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;(A-800）*20%&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;btn text tax-remove&quot; type=&quot;button&quot; disabled hidden&gt;删除&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;4000&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;20000&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;A*80%&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.01&quot; value=&quot;20&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;(A*80%）*20%&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;btn text tax-remove&quot; type=&quot;button&quot; disabled hidden&gt;删除&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;20000&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;50000&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;A*80%&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.01&quot; value=&quot;30&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;(A*80%）*30%&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;btn text tax-remove&quot; type=&quot;button&quot; disabled hidden&gt;删除&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;50000&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;A*80%&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.01&quot; value=&quot;40&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;(A*80%）*40%&quot; readonly&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;btn text tax-remove&quot; type=&quot;button&quot; disabled hidden&gt;删除&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;config-actions&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-config-edit=&quot;tax&quot;&gt;编辑&lt;/button&gt;&lt;button class=&quot;btn primary&quot; type=&quot;button&quot; data-config-save=&quot;tax&quot; hidden&gt;保存&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;&lt;aside class=&quot;config-help&quot;&gt;&lt;div class=&quot;help-panel&quot;&gt;&lt;h2&gt;页面说明&lt;/h2&gt;&lt;section class=&quot;help-block&quot;&gt;&lt;h3&gt;用途&lt;/h3&gt;&lt;p&gt;维护创客中心提现时使用的阶梯税率规则。启用后才会生效，开关可在查看态直接切换。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;help-block&quot;&gt;&lt;h3&gt;编辑方式&lt;/h3&gt;&lt;p&gt;点击「编辑」后，金额上下限、应纳税额、税率和计算公式才可修改；可增加或删除阶梯。金额下限含当前值、金额上限不含当前值，最后一档上限留空表示无上限。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;help-block&quot;&gt;&lt;h3&gt;字段限制&lt;/h3&gt;&lt;p&gt;金额上下限为非负数，税率为 0–100%（最多两位小数）；应纳税额和计算公式不能为空，公式仅作为规则说明保存，不在此页面执行。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;help-block&quot;&gt;&lt;h3&gt;保存校验&lt;/h3&gt;&lt;p&gt;至少保留一档；档位按升序连续衔接，不得重叠或留空；只有最后一档允许上限为空，且上限必须大于下限。校验不通过时不会退出编辑状态。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;
      &lt;div class=&quot;config-page-wrap&quot; id=&quot;withdrawConfigWrap&quot;&gt;&lt;section class=&quot;admin-config-page&quot; id=&quot;withdrawConfigPage&quot; aria-label=&quot;提现设置&quot;&gt;
        &lt;div class=&quot;config-head&quot;&gt;&lt;h2&gt;提现设置&lt;/h2&gt;&lt;/div&gt;
        &lt;div class=&quot;config-body&quot;&gt;&lt;div class=&quot;config-section&quot;&gt;&lt;div class=&quot;config-section-title&quot;&gt;&lt;h3&gt;提现限制&lt;/h3&gt;&lt;label class=&quot;config-switch&quot;&gt;&lt;input id=&quot;withdrawEnabled&quot; type=&quot;checkbox&quot; checked&gt;&lt;span&gt;启用&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;config-grid&quot;&gt;&lt;div class=&quot;config-field&quot;&gt;&lt;label for=&quot;withdrawMin&quot;&gt;单笔最低金额（元）&lt;/label&gt;&lt;input id=&quot;withdrawMin&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;10&quot; readonly&gt;&lt;/div&gt;&lt;div class=&quot;config-field&quot;&gt;&lt;label for=&quot;withdrawMax&quot;&gt;单笔最高金额（元）&lt;/label&gt;&lt;input id=&quot;withdrawMax&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;2000&quot; readonly&gt;&lt;/div&gt;&lt;div class=&quot;config-field&quot;&gt;&lt;label for=&quot;dailyCount&quot;&gt;每日提现次数上限&lt;/label&gt;&lt;input id=&quot;dailyCount&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;3&quot; readonly&gt;&lt;/div&gt;&lt;div class=&quot;config-field&quot;&gt;&lt;label for=&quot;dailyAmount&quot;&gt;每日提现金额上限（元）&lt;/label&gt;&lt;input id=&quot;dailyAmount&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;3000&quot; readonly&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;config-actions&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-config-edit=&quot;withdraw&quot;&gt;编辑&lt;/button&gt;&lt;button class=&quot;btn primary&quot; type=&quot;button&quot; data-config-save=&quot;withdraw&quot; hidden&gt;保存&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;&lt;aside class=&quot;config-help&quot;&gt;&lt;div class=&quot;help-panel&quot;&gt;&lt;h2&gt;页面说明&lt;/h2&gt;&lt;section class=&quot;help-block&quot;&gt;&lt;h3&gt;用途&lt;/h3&gt;&lt;p&gt;维护创客中心提现金额和每日提现频次限制。启用后才会生效，开关可在查看态直接切换。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;help-block&quot;&gt;&lt;h3&gt;编辑方式&lt;/h3&gt;&lt;p&gt;点击「编辑」后，四个限制字段才可修改；完成后点击「保存」，保存成功会回到只读状态。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;help-block&quot;&gt;&lt;h3&gt;字段限制&lt;/h3&gt;&lt;p&gt;金额必须为非负数且最多两位小数；每日提现次数必须为正整数；单笔最高金额不得低于单笔最低金额，每日金额上限不得低于单笔最低金额。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;help-block&quot;&gt;&lt;h3&gt;保存校验&lt;/h3&gt;&lt;p&gt;任一字段为空、不是有效数字或不满足大小关系时，保存会被阻止并提示原因。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;
      &lt;div class=&quot;content-layout&quot;&gt;
      &lt;div class=&quot;content-primary&quot;&gt;
      &lt;details class=&quot;application-guide&quot;&gt;
&lt;summary&gt;页面说明&lt;span&gt;筛选、字段与操作规则&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;application-guide-body&quot;&gt;
&lt;h3&gt;一、页面用途&lt;/h3&gt;&lt;p&gt;管理课程顾问申请，查看申请人及推荐人信息，记录跟进情况，并办理开通、续费、关闭和重新开通。合作类型仅支持课程顾问，不提供修改身份、升级或名额配置。&lt;/p&gt;
&lt;h3&gt;二、搜索筛选&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;申请人：&lt;/strong&gt;按申请人姓名模糊搜索。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;电话：&lt;/strong&gt;按申请人手机号或号码片段搜索。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;推荐人信息：&lt;/strong&gt;按推荐人姓名或手机号片段搜索。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;状态：&lt;/strong&gt;支持全部状态、未跟进/跟进中、已成交、已关闭。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;申请时间：&lt;/strong&gt;按申请日期区间筛选，包含起止日期；可只填写开始日期或结束日期。&lt;/li&gt;&lt;li&gt;多个条件同时填写时，结果须满足全部条件。点击“搜索”后更新列表并回到第一页；“重置”清空条件，恢复全部记录。“收起/展开”只改变筛选区显示，不清空条件。&lt;/li&gt;&lt;/ul&gt;
&lt;h3&gt;三、列表字段&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;申请人、电话：&lt;/strong&gt;申请人的姓名和联系电话。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;合作类型：&lt;/strong&gt;已开通记录显示“课程顾问”及到期日期；未开通显示“-”；关闭后保留原合作类型及到期日期。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;推荐人信息：&lt;/strong&gt;分行显示推荐人姓名和脱敏手机号；无推荐人或平台邀约记录显示“-”。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;所在地区：&lt;/strong&gt;显示申请人所在省、市。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;申请时间：&lt;/strong&gt;显示完整的年月日时分秒。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;跟进记录：&lt;/strong&gt;点击“查看详情”查看跟进及状态变更记录，包括记录时间、类型、操作人和内容；没有记录时显示“-”。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;状态、操作：&lt;/strong&gt;根据当前状态展示可执行操作。列表支持分页及每页条数切换。&lt;/li&gt;&lt;/ul&gt;
&lt;h3&gt;四、状态与操作&lt;/h3&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;当前状态&lt;/th&gt;&lt;th&gt;可用操作&lt;/th&gt;&lt;th&gt;处理结果&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;未跟进 / 跟进中&lt;/td&gt;&lt;td&gt;添加跟进、成为代理&lt;/td&gt;&lt;td&gt;记录沟通情况；确认开通课程顾问后变为已成交。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;已成交&lt;/td&gt;&lt;td&gt;续费、关闭&lt;/td&gt;&lt;td&gt;续费延长到期时间；确认关闭后变为已关闭。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;已关闭&lt;/td&gt;&lt;td&gt;重新开启&lt;/td&gt;&lt;td&gt;重新开通课程顾问并设置到期时间，状态变为已成交。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;h3&gt;五、弹窗填写规则&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;添加跟进：&lt;/strong&gt;填写沟通情况，保存后可在跟进记录中追踪。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;成为代理：&lt;/strong&gt;合作类型固定为课程顾问；到期时间默认一年，可手动调整；备注选填。确认后更新合作类型、到期时间和状态，并生成操作记录。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;重新开启：&lt;/strong&gt;合作类型固定为课程顾问，重新设置到期时间（默认一年），可填写备注；确认后恢复为已成交，记录重新开通操作。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;续费：&lt;/strong&gt;选择1年、2年或3年，默认1年；弹窗预览续费前后到期日期，确认后在原到期日期上顺延所选年限，备注选填。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;关闭：&lt;/strong&gt;必须填写关闭原因后确认；关闭原因写入状态记录，原合作信息保留。&lt;/li&gt;&lt;li&gt;弹窗中的取消或关闭按钮不提交本次修改。&lt;/li&gt;&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;section class=&quot;filter-card&quot; id=&quot;filterCard&quot;&gt;
        &lt;div class=&quot;filter-grid&quot;&gt;
          &lt;div class=&quot;filter-field&quot;&gt;&lt;label for=&quot;contactKeyword&quot;&gt;申请人&lt;/label&gt;&lt;input id=&quot;contactKeyword&quot; type=&quot;text&quot; placeholder=&quot;请输入申请人姓名&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;filter-field&quot;&gt;&lt;label for=&quot;phoneKeyword&quot;&gt;电话&lt;/label&gt;&lt;input id=&quot;phoneKeyword&quot; type=&quot;tel&quot; placeholder=&quot;请输入手机号&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;filter-field&quot;&gt;&lt;label for=&quot;referrerKeyword&quot;&gt;推荐人信息&lt;/label&gt;&lt;input id=&quot;referrerKeyword&quot; type=&quot;text&quot; placeholder=&quot;推荐人姓名/手机号&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;filter-field&quot;&gt;&lt;label for=&quot;statusFilter&quot;&gt;状态&lt;/label&gt;&lt;select id=&quot;statusFilter&quot;&gt;&lt;option value=&quot;&quot; selected&gt;全部状态&lt;/option&gt;&lt;option value=&quot;pending&quot;&gt;未跟进/跟进中&lt;/option&gt;&lt;option value=&quot;已成交&quot;&gt;已成交&lt;/option&gt;&lt;option value=&quot;已关闭&quot;&gt;已关闭&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
          &lt;div class=&quot;filter-field time-field&quot;&gt;&lt;label for=&quot;startDate&quot;&gt;申请时间&lt;/label&gt;&lt;div class=&quot;date-range&quot;&gt;&lt;input id=&quot;startDate&quot; type=&quot;date&quot; aria-label=&quot;申请开始日期&quot;&gt;&lt;span&gt;至&lt;/span&gt;&lt;input id=&quot;endDate&quot; type=&quot;date&quot; aria-label=&quot;申请结束日期&quot;&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;filter-actions&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;resetFilter&quot;&gt;重置&lt;/button&gt;&lt;button class=&quot;btn primary&quot; type=&quot;button&quot; id=&quot;searchFilter&quot;&gt;搜索&lt;/button&gt;&lt;button class=&quot;btn text&quot; type=&quot;button&quot; id=&quot;collapseFilter&quot;&gt;收起&lt;/button&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;filter-expand&quot;&gt;&lt;span&gt;筛选条件已收起&lt;/span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;expandFilter&quot;&gt;展开&lt;/button&gt;&lt;/div&gt;
      &lt;/section&gt;
      &lt;section class=&quot;table-card&quot; id=&quot;tableCard&quot;&gt;
        &lt;div class=&quot;table-head&quot;&gt;
          &lt;div class=&quot;table-title&quot;&gt;&lt;h2&gt;合伙人申请&lt;/h2&gt;&lt;span class=&quot;count&quot; id=&quot;tableCount&quot;&gt;共 0 条&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;table-tools&quot;&gt;

  function renderPagination() {
    const count = pageCount();
    if (currentPage &gt; count) currentPage = count;
    prevPage.disabled = currentPage &lt;= 1;
    nextPage.disabled = currentPage &gt;= count;
    let start = Math.max(1, currentPage - 2);
    let end = Math.min(count, start + 4);
    start = Math.max(1, end - 4);
    let html = &quot;&quot;;
    if (start &gt; 1) { html += &#x27;&lt;button class=&quot;page-number&quot; type=&quot;button&quot; data-page=&quot;1&quot;&gt;1&lt;/button&gt;&#x27;; if (start &gt; 2) html += &#x27;&lt;span class=&quot;ellipsis-page&quot;&gt;…&lt;/span&gt;&#x27;; }
    for (let page = start; page &lt;= end; page++) html += &#x27;&lt;button class=&quot;page-number&#x27; + (page === currentPage ? &quot; active&quot; : &quot;&quot;) + &#x27;&quot; type=&quot;button&quot; data-page=&quot;&#x27; + page + &#x27;&quot;&gt;&#x27; + page + &#x27;&lt;/button&gt;&#x27;;
    if (end &lt; count) { if (end &lt; count - 1) html += &#x27;&lt;span class=&quot;ellipsis-page&quot;&gt;…&lt;/span&gt;&#x27;; html += &#x27;&lt;button class=&quot;page-number&quot; type=&quot;button&quot; data-page=&quot;&#x27; + count + &#x27;&quot;&gt;&#x27; + count + &#x27;&lt;/button&gt;&#x27;; }
    pageNumbers.innerHTML = html;
    if (pageNumbers.parentElement &amp;&amp; !pageNumbers.parentElement.contains(prevPage)) {}
  }

  document.getElementById(&quot;analysisTab&quot;).addEventListener(&quot;click&quot;, function(){ showToast(&quot;分析页暂未开放，当前原型聚焦合伙人申请列表&quot;, &quot;info&quot;); });
  document.getElementById(&quot;listTab&quot;).addEventListener(&quot;click&quot;, function(){ showToast(&quot;当前已是合伙人申请列表&quot;, &quot;info&quot;); });
  document.querySelectorAll(&quot;[data-nav]&quot;).forEach(function(item){
    item.addEventListener(&quot;click&quot;, function(){
      const name = item.getAttribute(&quot;data-nav&quot;);
      const submenu = item.nextElementSibling;
      if (submenu &amp;&amp; submenu.classList.contains(&quot;submenu&quot;)) { item.classList.toggle(&quot;open&quot;); submenu.classList.toggle(&quot;open&quot;); return; }
      if (item.tagName === &quot;A&quot;) return;
      const config = name === &quot;税率配置&quot; ? &quot;taxConfigPage&quot; : name === &quot;提现设置&quot; ? &quot;withdrawConfigPage&quot; : &quot;&quot;;
      if (config) { document.querySelectorAll(&quot;.config-page-wrap&quot;).forEach(function(wrap){ wrap.classList.toggle(&quot;show&quot;, wrap.id === (config === &quot;taxConfigPage&quot; ? &quot;taxConfigWrap&quot; : &quot;withdrawConfigWrap&quot;)); }); document.querySelector(&quot;.content-layout&quot;).style.display = &quot;none&quot;; document.querySelectorAll(&quot;.submenu-item&quot;).forEach(function(link){ link.classList.toggle(&quot;active&quot;, link === item); }); return; }
      if (name === &quot;合伙人申请&quot;) { document.querySelectorAll(&quot;.config-page-wrap&quot;).forEach(function(wrap){ wrap.classList.remove(&quot;show&quot;); }); document.querySelector(&quot;.content-layout&quot;).style.display = &quot;&quot;; }

  });
  document.getElementById(&quot;addTaxTier&quot;).addEventListener(&quot;click&quot;, function(){ const row=document.createElement(&quot;tr&quot;); row.innerHTML=&#x27;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; value=&quot;&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;A*80%&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.01&quot; value=&quot;20&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input value=&quot;(A*80%）*20%&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;btn text tax-remove&quot; type=&quot;button&quot;&gt;删除&lt;/button&gt;&lt;/td&gt;&#x27;; document.getElementById(&quot;taxTierBody&quot;).appendChild(row); });

  function validateTaxConfig(){
    const rows=Array.from(document.querySelectorAll(&quot;#taxTierBody tr&quot;));
    if(!rows.length) return &quot;至少保留一个税率阶梯&quot;;
    const tiers=[];
    for(let i=0;i&lt;rows.length;i++){
      const cells=rows[i].querySelectorAll(&quot;td&quot;);
      const lower=Number(cells[0].querySelector(&quot;input&quot;).value), upperText=cells[1].querySelector(&quot;input&quot;).value.trim(), upper=upperText===&quot;&quot;?null:Number(upperText);
      const taxable=cells[2].querySelector(&quot;input&quot;).value.trim(), rateText=cells[3].querySelector(&quot;input&quot;).value.trim(), rate=Number(rateText), formula=cells[4].querySelector(&quot;input&quot;).value.trim();
      if(!Number.isFinite(lower)||lower&lt;0) return `第${i+1}档：金额下限必须为非负数`;
      if(upper!==null&amp;&amp;(!Number.isFinite(upper)||upper&lt;=lower)) return `第${i+1}档：金额上限必须大于下限`;
      if(upper===null&amp;&amp;i!==rows.length-1) return `第${i+1}档：只有最后一档可以不填写上限`;
      if(upper===null&amp;&amp;i===0&amp;&amp;rows.length&gt;1) return &quot;无上限档必须放在最后一档&quot;;
      if(rateText===&quot;&quot;||!Number.isFinite(rate)||rate&lt;0||rate&gt;100||!/^\d+(\.\d{1,2})?$/.test(rateText)) return `第${i+1}档：税率需为0–100之间、最多两位小数的数字`;
      if(!taxable) return `第${i+1}档：应纳税额不能为空`;
      if(!formula) return `第${i+1}档：计算公式不能为空`;
      tiers.push({lower,upper});
    }
    for(let i=0;i&lt;tiers.length;i++){
      if(i===0&amp;&amp;tiers[i].lower!==0) return &quot;第一档金额下限必须从0开始&quot;;
      if(i&gt;0&amp;&amp;tiers[i].lower!==tiers[i-1].upper) return `第${i+1}档：金额下限必须与上一档上限相同，确保连续且不重叠`;
      if(i&lt;tiers.length-1&amp;&amp;tiers[i].upper===null) return &quot;无上限档必须放在最后一档&quot;;
      if(i===tiers.length-1&amp;&amp;tiers[i].upper!==null) return &quot;最后一档金额上限请留空，表示无上限&quot;;
    }
    return &quot;&quot;;
  }
  function validateWithdrawConfig(){
    const money=[[&#x27;单笔最低金额&#x27;,&#x27;withdrawMin&#x27;],[&#x27;单笔最高金额&#x27;,&#x27;withdrawMax&#x27;],[&#x27;每日提现金额上限&#x27;,&#x27;dailyAmount&#x27;]];
    for(const [label,id] of money){const input=document.getElementById(id),value=input.value.trim(),number=Number(value);if(value===&quot;&quot;||!Number.isFinite(number)||number&lt;0||!/^\d+(\.\d{1,2})?$/.test(value))return `${label}需为非负数字，最多两位小数`;}
    const count=document.getElementById(&quot;dailyCount&quot;).value.trim();if(!/^\d+$/.test(count)||Number(count)&lt;1)return &quot;每日提现次数上限必须为正整数&quot;;
    if(Number(document.getElementById(&quot;withdrawMax&quot;).value)&lt;Number(document.getElementById(&quot;withdrawMin&quot;).value))return &quot;单笔最高金额不能低于单笔最低金额&quot;;
    if(Number(document.getElementById(&quot;dailyAmount&quot;).value)&lt;Number(document.getElementById(&quot;withdrawMin&quot;).value))return &quot;每日提现金额上限不能低于单笔最低金额&quot;;
    return &quot;&quot;;
  }

    const page = button.closest(&quot;.admin-config-page&quot;);

    page.querySelectorAll(&quot;input&quot;).forEach(function(input){ if (input.type !== &quot;checkbox&quot;) input.readOnly = true; });
    if (button.getAttribute(&quot;data-config-save&quot;) === &quot;tax&quot;) { document.getElementById(&quot;addTaxTier&quot;).disabled = true; document.getElementById(&quot;addTaxTier&quot;).hidden = true; document.querySelectorAll(&quot;.tax-remove&quot;).forEach(function(btn){ btn.disabled = true; btn.hidden = true; }); }
    button.hidden = true;
    page.querySelector(&quot;[data-config-edit]&quot;).hidden = false;
    showToast(&quot;配置已保存&quot;, &quot;success&quot;);
  }); });
  applyFilters();
})();
